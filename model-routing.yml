# Model routing table.
#
# This file is the only place model, effort, and thinking values live. It is a
# build input and never ships in a plugin payload.
#
# Restricted subset: section headers at column 0, rows at 2 spaces, plain
# properties at 4 spaces, and one-level inline maps. Tabs, quoted scalars,
# nested maps, and any other syntax fail the build with file, line, and
# offending content. See scripts/lib/model-routing.sh for the validator and
# specs/_plans/add-model-routing-table/plan.md for the grammar contract.
#
# Each row names its source file, a one-line note for the generated docs
# tables, and one map per harness. An empty map (`{}`) injects nothing and
# lets that harness inherit its default. `pi.model` is null unless a model is
# deliberately pinned; a non-null value reaches the operator's Pi settings
# through the generated pi/model-overrides.json.

agents:
  planner-agent:
    file: .claude/agents/planner-agent.md
    note: Spec deltas, context, task decomposition
    claude: { model: opus, effort: xhigh }
